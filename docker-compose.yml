services:
  app:
    build: .
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --reload"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/code

    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /code/app
          ignore:
            - __pycache__/

        - action: rebuild
          path: ./Dockerfile

        - action: rebuild
          path: ./requirements.txt

        - action: rebuild
          path: ./.env

  worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/code

    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /code/app
          ignore:
            - __pycache__/

        - action: rebuild
          path: ./Dockerfile

        - action: rebuild
          path: ./requirements.txt

        - action: rebuild
          path: ./.env