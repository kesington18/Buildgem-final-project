services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/code

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: student_info_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ILoveRice123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: