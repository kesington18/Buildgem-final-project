services:
  app:
    build: .
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --reload"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/code

  worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/code
